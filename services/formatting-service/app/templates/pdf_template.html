<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <meta name="author" content="{{ author }}">
  <meta name="generator" content="Universal Publishing Platform">
  <style>
    /* ---------- Page setup ---------- */
    @page {
      size: A5;
      margin: 20mm 18mm;
      @bottom-center {
        content: counter(page);
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 9pt;
        color: #666;
      }
    }
    @page :first {
      margin: 0;
      @bottom-center { content: none; }
    }

    /* ---------- Base typography ---------- */
    html { font-size: 11pt; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1.65;
      color: #1a1a1a;
      text-align: justify;
      hyphens: auto;
      -webkit-hyphens: auto;
    }

    /* ---------- Headings ---------- */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 700;
      color: #111;
      page-break-after: avoid;
      line-height: 1.25;
    }
    h1 { font-size: 26pt; margin: 0 0 0.6em; }
    h2 { font-size: 18pt; margin: 2em 0 0.6em; page-break-before: auto; }
    h3 { font-size: 14pt; margin: 1.6em 0 0.5em; }
    h4 { font-size: 12pt; margin: 1.2em 0 0.4em; }

    /* ---------- Body text ---------- */
    p { margin: 0 0 0.85em 0; orphans: 2; widows: 2; }
    p:first-of-type::first-letter {
      font-size: 3em;
      float: left;
      line-height: 0.85;
      padding-right: 0.08em;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
    }
    strong { font-weight: 700; }
    em { font-style: italic; }
    a { color: #2563eb; text-decoration: underline; }

    /* ---------- Blockquote ---------- */
    blockquote {
      margin: 1.5em 1.5em;
      padding-left: 1em;
      border-left: 3px solid #cbd5e1;
      color: #475569;
      font-style: italic;
    }

    /* ---------- Code ---------- */
    pre, code {
      font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
      font-size: 9pt;
    }
    code {
      background: #f1f5f9;
      padding: 0.15em 0.35em;
      border-radius: 3px;
    }
    pre {
      background: #f8fafc;
      padding: 1em;
      border-radius: 4px;
      overflow-x: auto;
      page-break-inside: avoid;
      border-left: 3px solid #cbd5e1;
    }
    pre code { background: none; padding: 0; }

    /* ---------- Lists ---------- */
    ul, ol { margin: 0.8em 0 0.8em 1.4em; padding: 0; }
    li { margin-bottom: 0.35em; }

    /* ---------- Tables ---------- */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 10pt;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 0.5em 0.75em;
      text-align: left;
      vertical-align: top;
    }
    thead th {
      background: #f8fafc;
      font-weight: 700;
    }

    /* ---------- Images ---------- */
    img { max-width: 100%; height: auto; display: block; margin: 1em auto; }
    figure { margin: 1.2em 0; text-align: center; }
    figcaption {
      font-size: 9pt;
      color: #64748b;
      margin-top: 0.4em;
      font-style: italic;
    }

    /* ---------- Rules ---------- */
    hr {
      border: none;
      border-top: 1px solid #cbd5e1;
      margin: 2em auto;
      width: 40%;
    }

    /* ---------- Cover page ---------- */
    .cover-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 210mm;
      text-align: center;
      padding: 0 20mm;
      page-break-after: always;
    }
    .cover-page h1 {
      font-size: 34pt;
      margin: 0 0 0.3em;
      line-height: 1.15;
    }
    .cover-page .author {
      font-size: 14pt;
      color: #475569;
      margin-top: 2em;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    .cover-page .publisher {
      margin-top: auto;
      font-size: 9pt;
      color: #94a3b8;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ---------- Section breaks ---------- */
    .page-break { page-break-after: always; }
    h2.new-page { page-break-before: always; }

    /* ---------- Footnotes ---------- */
    .footnotes {
      border-top: 1px solid #cbd5e1;
      margin-top: 3em;
      padding-top: 1em;
      font-size: 9pt;
      color: #475569;
    }
  </style>
</head>
<body>
  <!-- Cover -->
  <div class="cover-page">
    <h1>{{ title }}</h1>
    <div class="author">by {{ author }}</div>
    <div class="publisher">Universal Publishing Platform</div>
  </div>

  <!-- Body (rendered by Pandoc + this template's CSS) -->
  {{ body }}
</body>
</html>
