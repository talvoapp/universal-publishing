# ============================================================
# Universal Publishing Platform - Redis Configuration
# Version: 7.2+
# Scope: Sessions, Cache, Quotas, Feeds, Entitlements
# ============================================================

# ------------------------------------------------------------
# NETWORK
# ------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
tcp-keepalive 300
timeout 0

# ------------------------------------------------------------
# GENERAL
# ------------------------------------------------------------
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
always-show-logo no

# ------------------------------------------------------------
# SNAPSHOTTING (RDB)
# ------------------------------------------------------------
# Format: save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ------------------------------------------------------------
# REPLICATION (Sentinel in production)
# ------------------------------------------------------------
# replicaof <masterip> <masterport>
# masterauth <master-password>
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-diskless-load disabled
repl-disable-tcp-nodelay no
replica-priority 100

# ------------------------------------------------------------
# AOF (Append-Only File) — durability for critical data
# ------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes
aof-timestamp-enabled yes

# ------------------------------------------------------------
# MEMORY MANAGEMENT
# ------------------------------------------------------------
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ------------------------------------------------------------
# LAZY FREEING (reduces latency spikes)
# ------------------------------------------------------------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# ------------------------------------------------------------
# KEYS TRACKING (for pub/sub client-side caching, Redis 6+)
# ------------------------------------------------------------
tracking-table-max-keys 1000000

# ------------------------------------------------------------
# SECURITY
# ------------------------------------------------------------
# Password set via environment variable in production
# requirepass <REDIS_PASSWORD>
rename-command CONFIG "CONFIG_7c3a9b2e1f"
rename-command DEBUG ""
rename-command SHUTDOWN "SHUTDOWN_9b2e1f7c3a"
rename-command FLUSHALL ""
rename-command FLUSHDB ""

# ACL (Redis 6+) — uncomment for production
# user default off
# user auth_service on >auth_secret ~auth:* ~session:* +@read +@write +@connection
# user editor_service on >editor_secret ~editor:* ~presence:* +@read +@write +@connection
# user ai_service on >ai_secret ~ai:* ~quota:* +@read +@write +@connection
# user marketplace_service on >mkt_secret ~market:* ~idempotency:* +@read +@write +@connection
# user content_service on >content_secret ~ent:* +@read +@connection
# user feed_service on >feed_secret ~feed:* ~timeline:* ~celeb:* +@read +@write +@connection

# ------------------------------------------------------------
# CLIENTS
# ------------------------------------------------------------
maxclients 10000

# ------------------------------------------------------------
# SLOW LOG
# ------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# ------------------------------------------------------------
# LATENCY MONITOR
# ------------------------------------------------------------
latency-monitor-threshold 100

# ------------------------------------------------------------
# EVENT NOTIFICATION (for cache invalidation consumers)
# ------------------------------------------------------------
notify-keyspace-events "Ex"

# ------------------------------------------------------------
# ADVANCED CONFIG
# ------------------------------------------------------------
hash-max-listpack-entries 128
hash-max-listpack-value 64
list-max-listpack-size -2
set-max-intset-entries 512
set-max-listpack-entries 128
set-max-listpack-value 64
zset-max-listpack-entries 128
zset-max-listpack-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# ------------------------------------------------------------
# ACTIVE REHASHING
# ------------------------------------------------------------
activerehashing yes

# ------------------------------------------------------------
# CLIENT OUTPUT BUFFER LIMITS
# ------------------------------------------------------------
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ------------------------------------------------------------
# BACKGROUND I/O
# ------------------------------------------------------------
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# ------------------------------------------------------------
# NOTES ON DB SEGREGATION (logical databases)
# ------------------------------------------------------------
# DB 0: auth sessions & refresh tokens
# DB 1: editor presence + patch buffers
# DB 2: AI quotas + SSE resume sessions
# DB 3: marketplace cache + idempotency keys
# DB 4: entitlement cache (READ-HOT)
# DB 5: feed timelines (Redis Sorted Sets)
# DB 6: notifications dedup