# ============================================================
# API Gateway — Main Virtual Host
# Routes /api/v1/* to appropriate microservice
# ============================================================

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # --------------------------------------------------------
    # COMMON PROXY SETTINGS
    # --------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffering       on;
    proxy_buffer_size     4k;
    proxy_buffers         8 4k;
    proxy_busy_buffers_size 8k;

    # --------------------------------------------------------
    # SECURITY HEADERS
    # --------------------------------------------------------
    include /etc/nginx/conf.d/security-headers.conf;

    # --------------------------------------------------------
    # GLOBAL CONNECTION LIMITS
    # --------------------------------------------------------
    limit_conn conn_zone 50;

    # --------------------------------------------------------
    # CORS PREFLIGHT (catch-all, refined per-route below)
    # --------------------------------------------------------
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin       $http_origin always;
        add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Idempotency-Key, If-Match, X-Request-ID" always;
        add_header Access-Control-Allow-Credentials  "true" always;
        add_header Access-Control-Max-Age            86400 always;
        add_header Content-Length                    0;
        add_header Content-Type                      "text/plain charset=UTF-8";
        return 204;
    }

    # --------------------------------------------------------
    # HEALTH CHECK
    # --------------------------------------------------------
    location = /health {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # ========================================================
    # AUTH SERVICE — /api/v1/auth/* , /api/v1/users/* , /api/v1/oauth/*
    # ========================================================
    location ~ ^/api/v1/(auth|users|oauth)/ {
        limit_req zone=auth_zone burst=10 nodelay;

        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://auth_backend;

        # Do not cache auth responses
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ========================================================
    # EDITOR SERVICE — /api/v1/editor/* , /api/v1/taxonomy/*
    # ========================================================
    location ~ ^/api/v1/(editor|taxonomy)/ {
        limit_req zone=general_zone burst=50 nodelay;

        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://editor_backend;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # ========================================================
    # EDITOR WEBSOCKET — /editor/stream
    # ========================================================
    location /editor/stream {
        proxy_pass http://editor_ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID      $request_id;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        proxy_cache off;
    }

    # ========================================================
    # AI SERVICE — /api/v1/ai/*  (SSE streaming)
    # ========================================================
    location ~ ^/api/v1/ai/ {
        limit_req zone=ai_zone burst=5 nodelay;

        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://ai_backend;

        # Critical for Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-store" always;
    }

    # ========================================================
    # MARKETPLACE SERVICE — /api/v1/market/* , /webhooks/stripe
    # ========================================================
    location ~ ^/api/v1/market/(checkout|subscriptions|orders|refund) {
        limit_req zone=checkout_zone burst=3 nodelay;

        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://marketplace_backend;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # Public catalog (cacheable)
    location ~ ^/api/v1/market/(items|categories) {
        limit_req zone=general_zone burst=100 nodelay;

        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://marketplace_backend;

        proxy_cache public_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_key "$scheme$request_method$host$request_uri";

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Stripe webhooks (must NOT be rate-limited aggressively; verified by signature)
    location = /webhooks/stripe {
        limit_req zone=webhook_zone burst=200 nodelay;

        # Stripe IPs only — enforce in production
        # allow 3.18.12.63;
        # allow 3.130.192.231;
        # allow 13.235.14.237;
        # deny all;

        proxy_pass http://marketplace_backend;
        proxy_cache off;
        client_max_body_size 1m;
        proxy_read_timeout 15s;
    }

    # ========================================================
    # WALLET SERVICE — /api/v1/wallet/*
    # ========================================================
    location ~ ^/api/v1/wallet/ {
        limit_req zone=general_zone burst=20 nodelay;

        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://wallet_backend;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # ========================================================
    # CONTENT SERVICE — /api/v1/content/*  (entitlement gated)
    # ========================================================
    location ~ ^/api/v1/content/ {
        limit_req zone=general_zone burst=50 nodelay;

        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://content_backend;

        # CRITICAL: gated content must NEVER be CDN/browser cached
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ========================================================
    # FEED SERVICE — /api/v1/feed/*
    # ========================================================
    location ~ ^/api/v1/feed/ {
        limit_req zone=general_zone burst=50 nodelay;

        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://feed_backend;
        proxy_cache off;
        add_header Cache-Control "private, max-age=30" always;
    }

    # ========================================================
    # WEB DASHBOARD (React SPA) — fallback to index.html
    # ========================================================
    location /app/ {
        proxy_pass http://web_dashboard/;
        proxy_set_header Host $host;
    }

    # ========================================================
    # DEFAULT — 404 JSON
    # ========================================================
    location / {
        add_header Content-Type application/json always;
        return 404 '{"type":"https://httpstatuses.io/404","title":"Not Found","status":404}';
    }

    # ========================================================
    # ERROR PAGES (JSON)
    # ========================================================
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        add_header Content-Type application/json always;
        return 429 '{"type":"https://httpstatuses.io/429","title":"Too Many Requests","status":429,"detail":"Rate limit exceeded. Please retry after the indicated window."}';
    }

    error_page 502 503 504 = @upstream_error;
    location @upstream_error {
        add_header Content-Type application/json always;
        return 503 '{"type":"https://httpstatuses.io/503","title":"Service Unavailable","status":503,"detail":"Upstream service temporarily unavailable."}';
    }
}

# ============================================================
# PUBLIC SITE (Next.js) — port 3001, proxied through :8443
# ============================================================
server {
    listen 8443;
    server_name _;

    include /etc/nginx/conf.d/security-headers.conf;

    location / {
        proxy_pass http://public_site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Next.js static assets
        location ~ ^/_next/static/ {
            proxy_pass http://public_site;
            proxy_cache public_cache;
            proxy_cache_valid 200 1h;
            add_header Cache-Control "public, max-age=3600, immutable" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Serve HTML — cache briefly
        proxy_cache public_cache;
        proxy_cache_valid 200 1m;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}