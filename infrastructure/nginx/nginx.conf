# ============================================================
# Universal Publishing Platform - Main Nginx Configuration
# ============================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # --------------------------------------------------------
    # MIME TYPES & DEFAULTS
    # --------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    charset utf-8;
    server_tokens off;

    # --------------------------------------------------------
    # LOGGING (JSON for ELK/Loki ingestion)
    # --------------------------------------------------------
    log_format json_combined escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"remote_user":"$remote_user",'
      '"request":"$request",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"http_x_forwarded_for":"$http_x_forwarded_for",'
      '"http_x_request_id":"$http_x_request_id",'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_response_time":"$upstream_response_time",'
      '"upstream_status":"$upstream_status"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    # --------------------------------------------------------
    # PERFORMANCE
    # --------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # --------------------------------------------------------
    # COMPRESSION
    # --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # --------------------------------------------------------
    # RATE LIMITING ZONES
    # --------------------------------------------------------
    # Per-IP zones for different endpoint categories
    limit_req_zone $binary_remote_addr zone=auth_zone:20m      rate=5r/s;
    limit_req_zone $binary_remote_addr zone=general_zone:20m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ai_zone:20m        rate=2r/s;
    limit_req_zone $binary_remote_addr zone=checkout_zone:20m  rate=1r/s;
    limit_req_zone $binary_remote_addr zone=webhook_zone:20m   rate=50r/s;

    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # --------------------------------------------------------
    # CACHE ZONES
    # --------------------------------------------------------
    proxy_cache_path /var/cache/nginx/public
        levels=1:2
        keys_zone=public_cache:100m
        max_size=2g
        inactive=60m
        use_temp_path=off;

    # --------------------------------------------------------
    # SSL/TLS (Production — commented out for local dev)
    # --------------------------------------------------------
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # --------------------------------------------------------
    # REAL IP (behind Cloudflare / AWS ALB)
    # --------------------------------------------------------
    # set_real_ip_from 10.0.0.0/8;
    # set_real_ip_from 172.16.0.0/12;
    # set_real_ip_from 173.245.48.0/20;  # Cloudflare
    # real_ip_header CF-Connecting-IP;
    # real_ip_recursive on;

    # --------------------------------------------------------
    # UPSTREAM DEFINITIONS
    # --------------------------------------------------------
    upstream auth_backend {
        least_conn;
        server auth-service:4001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream editor_backend {
        least_conn;
        server editor-service:4002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream editor_ws_backend {
        ip_hash;
        server editor-service:4002 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream ai_backend {
        least_conn;
        server ai-service:4003 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream marketplace_backend {
        least_conn;
        server marketplace-service:4004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream wallet_backend {
        least_conn;
        server wallet-service:4005 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream content_backend {
        least_conn;
        server content-service:4006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream feed_backend {
        least_conn;
        server feed-service:4007 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream web_dashboard {
        server web-dashboard:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream public_site {
        server public-site:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # --------------------------------------------------------
    # INCLUDE VIRTUAL HOSTS
    # --------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}