name: Dependency Update

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================
  # Update Node.js dependencies across all services
  # ============================================================
  update-npm:
    name: npm update (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, editor-service, ai-service, notification-service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          npm update
          npm audit fix --audit-level=high || true
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(deps): update ${{ matrix.service }} npm dependencies"
          branch: "deps/npm-${{ matrix.service }}"
          title: "chore(deps): update ${{ matrix.service }} npm dependencies"
          body: |
            Automated dependency update for `${{ matrix.service }}`.
            - Ran `npm update`
            - Ran `npm audit fix` (non-breaking)
          labels: ["dependencies", "automated"]
          delete-branch: true

  # ============================================================
  # Update Go dependencies
  # ============================================================
  update-go:
    name: go get -u (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [marketplace-service, wallet-service, content-service, feed-service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Update deps
        working-directory: services/${{ matrix.service }}
        run: |
          go get -u ./...
          go mod tidy
      - name: Verify build
        working-directory: services/${{ matrix.service }}
        run: go build ./...
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(deps): update ${{ matrix.service }} Go dependencies"
          branch: "deps/go-${{ matrix.service }}"
          title: "chore(deps): update ${{ matrix.service }} Go dependencies"
          body: |
            Automated `go get -u ./...` update for `${{ matrix.service }}`.
            Verified with `go build ./...`.
          labels: ["dependencies", "automated"]
          delete-branch: true

  # ============================================================
  # Update Python dependencies
  # ============================================================
  update-pip:
    name: pip update (formatting-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update deps
        working-directory: services/formatting-service
        run: |
          pip install pip-tools
          pip-compile --upgrade requirements.txt -o requirements.txt || true
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(deps): update formatting-service Python dependencies"
          branch: "deps/pip-formatting-service"
          title: "chore(deps): update formatting-service Python dependencies"
          body: |
            Automated `pip-compile --upgrade` for `formatting-service`.
          labels: ["dependencies", "automated"]
          delete-branch: true