name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test-node:
    name: Node.js services (lint + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, editor-service, ai-service, notification-service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: npm ci
      - name: Type check
        working-directory: services/${{ matrix.service }}
        run: npm run typecheck
      - name: Lint
        working-directory: services/${{ matrix.service }}
        run: npm run lint
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: npm test -- --passWithNoTests

  build-and-test-go:
    name: Go services (build + vet + test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [marketplace-service, wallet-service, content-service, feed-service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: Build
        working-directory: services/${{ matrix.service }}
        run: go build ./...
      - name: Vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: go test -race ./...

  test-python:
    name: Python service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        working-directory: services/formatting-service
        run: pip install -r requirements.txt
      - name: Test
        working-directory: services/formatting-service
        run: pytest --collect-only

  build-docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint-and-test-node, build-and-test-go, test-python]
    strategy:
      matrix:
        service:
          - auth-service
          - editor-service
          - ai-service
          - formatting-service
          - marketplace-service
          - wallet-service
          - content-service
          - feed-service
          - notification-service
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: upp/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max