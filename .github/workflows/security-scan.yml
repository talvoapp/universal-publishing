name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Daily at 03:00 UTC — catch newly disclosed CVEs
    - cron: "0 3 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================
  # Dependency vulnerability scan (all languages)
  # ============================================================
  npm-audit:
    name: npm audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, editor-service, ai-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: npm ci
      - name: Audit (high+)
        working-directory: services/${{ matrix.service }}
        run: npm audit --audit-level=high

  govulncheck:
    name: govulncheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [marketplace-service, wallet-service, content-service, feed-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        working-directory: services/${{ matrix.service }}
        run: govulncheck ./...

  pip-audit:
    name: pip-audit (formatting-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit
        working-directory: services/formatting-service
        run: pip-audit -r requirements.txt

  # ============================================================
  # Container image scanning (Trivy)
  # ============================================================
  trivy-scan:
    name: Trivy (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - editor-service
          - ai-service
          - formatting-service
          - marketplace-service
          - wallet-service
          - content-service
          - feed-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t upp/${{ matrix.service }}:scan services/${{ matrix.service }}
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: upp/${{ matrix.service }}:scan
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  # ============================================================
  # Secrets scanning (TruffleHog)
  # ============================================================
  trufflehog:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ============================================================
  # SAST (CodeQL) — Node + Go
  # ============================================================
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, go]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"